<svg
  class="absolute inset-0 w-full h-full"
  viewBox="0 0 430 932"
  preserveAspectRatio="xMaxYMin slice"
  xmlns="http://www.w3.org/2000/svg"
  shape-rendering="optimizeSpeed"
>
  <defs>
    <!-- Radial reveal mask: visible in upper-right, fades toward center-left -->
    <radialGradient id="mobileCornerReveal" cx="395" cy="16" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="1"/>
      <stop offset="28%"  stop-color="white" stop-opacity="0.88"/>
      <stop offset="52%"  stop-color="white" stop-opacity="0.42"/>
      <stop offset="72%"  stop-color="white" stop-opacity="0.08"/>
      <stop offset="88%"  stop-color="white" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="mobileCornerMask">
      <rect width="430" height="932" fill="url(#mobileCornerReveal)"/>
    </mask>

    <!-- Ambient atmosphere: unmasked, bleeds left as a subtle depth cue -->
    <radialGradient id="mobileAtmosGlow" cx="380" cy="245" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c7d2fe" stop-opacity="0.22"/>
      <stop offset="35%"  stop-color="#a5b4fc" stop-opacity="0.10"/>
      <stop offset="70%"  stop-color="#818cf8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <filter id="mobileMoonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Soft ambient glow -->
  <rect width="430" height="932" fill="url(#mobileAtmosGlow)"/>

  <!-- Celestial elements masked to upper-right corner -->
  <g mask="url(#mobileCornerMask)">

    <!-- Compact moon with a crisp core and soft visible halo -->
    <g>
      <circle cx="345" cy="275" r="20" fill="#c7d2fe" opacity="0.76" filter="url(#mobileMoonGlow)"/>
      <circle cx="345" cy="275" r="11" fill="#f8fafc" opacity="0.96"/>
      <circle cx="341" cy="271" r="8" fill="#e2e8f0" opacity="0.3"/>
    </g>

    <!-- Stars in upper-right quadrant -->
    <polygon points="0,-2.5 0.7,-0.7 2.8,0 0.7,0.7 0,2.8 -0.7,0.7 -2.8,0 -0.7,-0.7"
      transform="translate(315, 75)" fill="#a5b4fc" opacity="0.17">
      <animate attributeName="opacity" values="0.12; 0.42; 0.12" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-1.5 0.4,-0.4 1.8,0 0.4,0.4 0,1.8 -0.4,0.4 -1.8,0 -0.4,-0.4"
      transform="translate(372, 95)" fill="#c5c4cc" opacity="0.14">
      <animate attributeName="opacity" values="0.10; 0.35; 0.10" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-1 0.3,-0.3 1,0 0.3,0.3 0,1 -0.3,0.3 -1,0 -0.3,-0.3"
      transform="translate(354, 80)" fill="#60A839" opacity="0.14"/>
    <polygon points="0,-2 0.5,-0.5 2,0 0.5,0.5 0,2 -0.5,0.5 -2,0 -0.5,-0.5"
      transform="translate(345, 130)" fill="#a5b4fc" opacity="0.10">
      <animate attributeName="opacity" values="0.08; 0.28; 0.08" dur="9s" begin="2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-1.5 0.4,-0.4 1.8,0 0.4,0.4 0,1.8 -0.4,0.4 -1.8,0 -0.4,-0.4"
      transform="translate(275, 82)" fill="#a5b4fc" opacity="0.28">
      <animate attributeName="opacity" values="0.05; 0.20; 0.05" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>